<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张雪峰 AI 志愿助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── 顶栏 ── */
  header {
    width: 100%;
    max-width: 760px;
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .avatar {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #f97316, #dc2626);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; font-weight: bold;
    flex-shrink: 0;
  }
  header .info h1 { font-size: 16px; color: #111; }
  header .info p  { font-size: 12px; color: #6b7280; margin-top: 1px; }

  /* ── 消息区 ── */
  #messages {
    flex: 1;
    width: 100%;
    max-width: 760px;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg { display: flex; gap: 10px; max-width: 86%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot  { align-self: flex-start; }

  .bubble {
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: #2563eb;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: #fff;
    color: #1f2937;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .msg-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .msg.user .msg-avatar { background: #dbeafe; color: #1d4ed8; }
  .msg.bot  .msg-avatar { background: linear-gradient(135deg,#f97316,#dc2626); color:#fff; }

  /* 分层卡片 */
  .plan-cards { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .tier-card {
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .tier-card.reach  { background: #fff7ed; border: 1px solid #fed7aa; }
  .tier-card.match  { background: #f0fdf4; border: 1px solid #bbf7d0; }
  .tier-card.safety { background: #eff6ff; border: 1px solid #bfdbfe; }
  .tier-label { font-weight: 600; margin-bottom: 4px; font-size: 12px; }
  .tier-card.reach  .tier-label { color: #ea580c; }
  .tier-card.match  .tier-label { color: #16a34a; }
  .tier-card.safety .tier-label { color: #2563eb; }
  .school-row { display: flex; justify-content: space-between; padding: 2px 0; color: #374151; }
  .school-row .rank { color: #6b7280; font-size: 12px; }

  /* 加载动画 */
  .typing { display: flex; gap: 5px; align-items: center; padding: 12px 16px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #9ca3af; animation: bounce .8s infinite;
  }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .30s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); }
    40%          { transform: translateY(-6px); }
  }

  /* ── 快捷问题 ── */
  #quick-btns {
    width: 100%; max-width: 760px;
    padding: 0 16px 8px;
    display: flex; gap: 8px; overflow-x: auto;
    scrollbar-width: none;
  }
  #quick-btns::-webkit-scrollbar { display: none; }
  .quick-btn {
    flex-shrink: 0;
    padding: 6px 12px;
    border: 1px solid #d1d5db;
    border-radius: 20px;
    background: #fff;
    font-size: 12px; color: #374151;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s;
  }
  .quick-btn:hover { background: #f3f4f6; }

  /* ── 输入栏 ── */
  #input-area {
    width: 100%; max-width: 760px;
    padding: 10px 16px 16px;
    background: #f0f2f5;
    display: flex; gap: 8px; align-items: flex-end;
  }
  #input {
    flex: 1;
    min-height: 42px; max-height: 120px;
    padding: 10px 14px;
    border: 1px solid #d1d5db;
    border-radius: 22px;
    font-size: 14px; font-family: inherit;
    resize: none; outline: none;
    background: #fff;
    line-height: 1.5;
  }
  #input:focus { border-color: #2563eb; }
  #send-btn {
    width: 42px; height: 42px; flex-shrink: 0;
    background: #2563eb; border: none; border-radius: 50%;
    cursor: pointer; color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  #send-btn:hover { background: #1d4ed8; }
  #send-btn:disabled { background: #9ca3af; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="avatar">峰</div>
  <div class="info">
    <h1>张雪峰 AI 志愿助手</h1>
    <p>直接告诉你能报什么、不能报什么</p>
  </div>
</header>

<div id="messages">
  <!-- 欢迎消息 -->
  <div class="msg bot">
    <div class="msg-avatar">峰</div>
    <div class="bubble">你好！我是张雪峰 AI。

告诉我你的省份、分数、选科，我帮你分析志愿方案。也可以直接问我专业、就业、院校选择的问题。

说吧，别客气。</div>
  </div>
</div>

<div id="quick-btns">
  <button class="quick-btn" onclick="sendQuick('生化环材怎么样')">生化环材怎么样</button>
  <button class="quick-btn" onclick="sendQuick('普通家庭能报金融吗')">普通家庭能报金融吗</button>
  <button class="quick-btn" onclick="sendQuick('文科生出路在哪')">文科生出路在哪</button>
  <button class="quick-btn" onclick="sendQuick('专科和普通本科哪个好')">专科和普通本科哪个好</button>
  <button class="quick-btn" onclick="sendQuick('学中医有没有前途')">学中医有没有前途</button>
</div>

<div id="input-area">
  <textarea id="input" placeholder="输入省份、分数、选科，或直接提问…" rows="1"
    oninput="autoResize(this)"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"
  ></textarea>
  <button id="send-btn" onclick="sendMessage()">&#9650;</button>
</div>

<script>
let sessionId = null;
let isLoading = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function scrollToBottom() {
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}

function addMessage(role, text, planData) {
  const box = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = role === 'user' ? '我' : '峰';

  const bub = document.createElement('div');
  bub.className = 'bubble';
  // 有结构化 plan 卡片时，把 reply 里的冲/稳/保/⚠️院校 文字段去掉，避免重复
  let displayText = text;
  if (planData && (planData.reach?.length || planData.match?.length || planData.safety?.length)) {
    displayText = text
      .split('\n')
      .filter(line => !/^[🔥✅🛡️⚠️]/.test(line.trim()) && !/^  ·/.test(line))
      .join('\n')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }
  bub.textContent = displayText;

  // 如果有结构化方案，追加分层卡片
  if (planData && (planData.reach?.length || planData.match?.length || planData.safety?.length)) {
    const cards = document.createElement('div');
    cards.className = 'plan-cards';
    const tiers = [
      { key: 'reach',  label: '🔥 冲一冲', cls: 'reach'  },
      { key: 'match',  label: '✅ 稳一稳', cls: 'match'  },
      { key: 'safety', label: '🛡️ 保一保', cls: 'safety' },
    ];
    tiers.forEach(({ key, label, cls }) => {
      const list = planData[key] || [];
      if (!list.length) return;
      const card = document.createElement('div');
      card.className = 'tier-card ' + cls;
      card.innerHTML = `<div class="tier-label">${label}</div>` +
        list.map(u => `<div class="school-row"><span>${u.name}</span><span class="rank">参考位次 ${u.avg_min_rank.toLocaleString()}</span></div>`).join('');
      cards.appendChild(card);
    });
    bub.appendChild(cards);
  }

  wrap.appendChild(av);
  wrap.appendChild(bub);
  box.appendChild(wrap);
  scrollToBottom();
}

function showTyping() {
  const box = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'typing-indicator';

  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = '峰';

  const bub = document.createElement('div');
  bub.className = 'bubble typing';
  bub.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

  wrap.appendChild(av);
  wrap.appendChild(bub);
  box.appendChild(wrap);
  scrollToBottom();
}

function removeTyping() {
  document.getElementById('typing-indicator')?.remove();
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);

  isLoading = true;
  document.getElementById('send-btn').disabled = true;
  showTyping();

  try {
    const body = { message: text };
    if (sessionId) body.session_id = sessionId;

    const res = await fetch('/v1/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }

    const data = await res.json();
    sessionId = data.session_id;
    removeTyping();

    // 把 plan 中的卡片数据剥离，reply 里已有文字就不重复
    addMessage('bot', data.reply, data.plan);

  } catch (e) {
    removeTyping();
    addMessage('bot', '出错了：' + e.message + '\n\n请稍后重试，或检查服务是否正常运行。');
  } finally {
    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }
}

function sendQuick(text) {
  document.getElementById('input').value = text;
  sendMessage();
}
</script>
</body>
</html>
